<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Remeselník AI</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2le>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#020617;
color:white;
padding:30px;
}

.header{
background:#0f172a;
padding:30px;
border-radius:20px;
margin-bottom:25px;
}

.header h1{
font-size:40px;
margin-bottom:10px;
}

.header p{
color:#94a3b8;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:25px;
}

.stat{
background:#0f172a;
padding:25px;
border-radius:15px;
text-align:center;
border:1px solid #1e293b;
}

.stat-number{
font-size:42px;
font-weight:bold;
color:#3b82f6;
margin-bottom:10px;
}

.card{
background:#0f172a;
padding:25px;
border-radius:15px;
margin-bottom:25px;
border:1px solid #1e293b;
}

.card h2{
margin-bottom:20px;
}

.item{
background:#111827;
padding:15px;
border-radius:12px;
margin-bottom:12px;
border:1px solid #1e293b;
}

.item-title{
font-size:18px;
font-weight:bold;
margin-bottom:5px;
}

.item-subtitle{
color:#94a3b8;
}

button{
background:#2563eb;
color:white;
border:none;
padding:12px 18px;
border-radius:10px;
cursor:pointer;
margin-right:10px;
}

button:hover{
opacity:0.9;
}

</style>
</head>

<body>

<div class="header">

<h1>🏪 <span id="businessName">Loading...</span></h1>

<p>Barber Shop</p>

</div>

<div class="stats">

<div class="stat">
<div id="servicesCount" class="stat-number">0</div>
<div>Services</div>
</div>

<div class="stat">
<div id="employeesCount" class="stat-number">0</div>
<div>Employees</div>
</div>

<div class="stat">
<div id="customersCount" class="stat-number">0</div>
<div>Customers</div>
</div>

<div class="stat">
<div id="bookingsCount" class="stat-number">0</div>
<div>Bookings</div>
</div>

</div>

<div class="card">

<h2>✂️ Services</h2>

<div id="servicesList">
Loading...
</div>

<button>
+ Add Service
</button>

</div>

<div class="card">

<h2>👤 Employees</h2>

<div id="employeesList">
Loading...
</div>

<button>
+ Add Employee
</button>

</div>

<div class="card">

<h2>👥 Customers</h2>

<div id="customersList">
No customers yet
</div>

<button>
+ Add Customer
</button>

</div>

<script>

const SUPABASE_URL =
"https://urppomjdvsumtivcztes.supabase.co";

const SUPABASE_KEY =
"sb_publishable_tSNVgtPEwmIJiSKrqidPQw_QIbDquEE";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function loadDashboard(){

  try{

    const { data: businesses } =
      await supabaseClient
      .from("businesses")
      .select("*");

    if(businesses && businesses.length > 0){

      document.getElementById(
        "businessName"
      ).innerText =
      businesses[0].business_name;

    }

    const { data: services } =
      await supabaseClient
      .from("services")
      .select("*");

    document.getElementById(
      "servicesCount"
    ).innerText =
      services ? services.length : 0;

    let servicesHtml = "";

    if(services && services.length > 0){

      services.forEach(service => {

        servicesHtml += `
        <div class="item">

          <div class="item-title">
            ✂️ ${service.service_name}
          </div>

          <div class="item-subtitle">
            €${service.price} ·
            ${service.duration_minutes} min
          </div>

        </div>
        `;

      });

    }else{

      servicesHtml =
      "Žiadne služby";

    }

    document.getElementById(
      "servicesList"
    ).innerHTML =
      servicesHtml;

    const { data: employees } =
      await supabaseClient
      .from("employees")
      .select("*");

    document.getElementById(
      "employeesCount"
    ).innerText =
      employees ? employees.length : 0;

    let employeesHtml = "";

    if(employees && employees.length > 0){

      employees.forEach(employee => {

        employeesHtml += `
        <div class="item">

          <div class="item-title">
            👤 ${employee.employee_name}
          </div>

          <div class="item-subtitle">
            Active employee
          </div>

        </div>
        `;

      });

    }else{

      employeesHtml =
      "Žiadni zamestnanci";

    }

    document.getElementById(
      "employeesList"
    ).innerHTML =
      employeesHtml;

  }
  catch(error){

    console.error(error);

  }

}

loadDashboard();

</script>

</body>
</html>
