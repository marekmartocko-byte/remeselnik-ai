<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Remeselník AI</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#020617;
color:white;
padding:30px;
}

.header{
background:#0f172a;
padding:30px;
border-radius:20px;
margin-bottom:25px;
}

.card{
background:#0f172a;
padding:25px;
border-radius:15px;
margin-bottom:25px;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
margin-bottom:25px;
}

.stat{
background:#111827;
padding:25px;
border-radius:15px;
text-align:center;
}

.stat-number{
font-size:40px;
font-weight:bold;
color:#3b82f6;
}

.item{
background:#111827;
padding:15px;
margin-bottom:10px;
border-radius:10px;
}

button{
background:#2563eb;
color:white;
border:none;
padding:12px 20px;
border-radius:10px;
cursor:pointer;
}
</style>

</head>

<body>

<div class="header">

<h1>🏪 Marek Barber</h1>

<p>Barber Shop</p>

</div>

<div class="stats">

<div class="stat">
<div class="stat-number">2</div>
<div>Services</div>
</div>

<div class="stat">
<div class="stat-number">2</div>
<div>Employees</div>
</div>

<div class="stat">
<div class="stat-number">0</div>
<div>Customers</div>
</div>

<div class="stat">
<div class="stat-number">0</div>
<div>Bookings</div>
</div>

</div>

<div class="card">

<h2>✂️ Services</h2>

<div class="item">
Pánsky strih<br>
20 €<br>
30 min
</div>

<div class="item">
Farbenie<br>
60 €<br>
90 min
</div>

<button>
+ Add Service
</button>

</div>

<div class="card">

<h2>👤 Employees</h2>

<div class="item">
Peter
</div>

<div class="item">
Jana
</div>

<button>
+ Add Employee
</button>

</div>

<div class="card">

<h2>👥 Customers</h2>

Žiadni zákazníci

<br><br>

<button>
+ Add Customer
</button>

</div>

</body>
</html>
