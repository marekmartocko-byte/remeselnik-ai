<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Remeselník AI Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase
<style>
body{
  font-family:Arial,sans-serif;
  background:#020617;
  color:white;
  padding:40px;
}

h1{
  color:#3b82f6;
}

.card{
  background:#0f172a;
  padding:30px;
  border-radius:20px;
  margin-bottom:25px;
  border:1px solid #1e293b;
}

.card h2{
  margin-bottom:20px;
}

.service-item,
.employee-item{
  background:#111827;
  padding:15px;
  margin-bottom:12px;
  border-radius:12px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
}

.stat{
  background:#111827;
  padding:25px;
  border-radius:15px;
  text-align:center;
}

.stat-number{
  font-size:40px;
  font-weight:bold;
  color:#3b82f6;
}
  background:#0f172a;
  padding:25px;
  border-radius:15px;
  margin-bottom:20px;
}

.service-item,
.employee-item{
  padding:12px;
  margin-bottom:10px;
  border:1px solid #1e293b;
  border-radius:10px;
}

button{
  padding:10px 15px;
  margin-right:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
</style>

</head>

<body>

<h1>Remeselník AI Dashboard</h1>
<div class="card">

<h2>🏪 Marek Barber</h2>

<p>Barber Shop</p>

</div>

<div class="stats">

<div class="stat">
<div class="stat-number">2</div>
<div>Services</div>
</div>

<div class="stat">
<div class="stat-number">2</div>
<div>Employees</div>
</div>

<div class="stat">
<div class="stat-number">0</div>
<div>Customers</div>
</div>

<div class="stat">
<div class="stat-number">0</div>
<div>Bookings</div>
</div>

</div>
<div class="card">
  <h2>Business</h2>
  <div id="business">Načítavam...</div>
</div>

<div class="card">
  <h2>✂️ Services</h2>
  <div id="servicesList">Loading...</div>
</div>

<div class="card">
  <h2>👤 Employees</h2>
  <div id="employeesList">Loading...</div>
</div>

<div class="card">
  <h2>⚡ Quick Actions</h2>

  <button onclick="alert('Add Service bude ďalší krok')">
    + Add Service
  </button>

  <button onclick="alert('Add Employee bude ďalší krok')">
    + Add Employee
  </button>

  <button onclick="alert('Add Customer bude ďalší krok')">
    + Add Customer
  </button>

</div>

<script>

const SUPABASE_URL =
"https://urppomjdvsumtivcztes.supabase.co";

const SUPABASE_KEY =
"sb_publishable_tSNVgtPEwmIJiSKrqidPQw_QIbDquEE";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function loadDashboard(){

  try{

    const { data: businesses } =
      await supabaseClient
        .from("businesses")
        .select("*");

    if(businesses && businesses.length > 0){

      document.getElementById("business").innerText =
        businesses[0].business_name;

    }

    const { data: services } =
      await supabaseClient
        .from("services")
        .select("*");

    let servicesHtml = "";

    if(services && services.length > 0){

      services.forEach(service => {

        servicesHtml += `
          <div class="service-item">
            <strong>✂️ ${service.service_name}</strong><br>
            €${service.price}<br>
            ${service.duration_minutes} min
          </div>
        `;

      });

    } else {

      servicesHtml = "Žiadne služby";

    }

    document.getElementById("servicesList").innerHTML =
      servicesHtml;

    const { data: employees } =
      await supabaseClient
        .from("employees")
        .select("*");

    let employeesHtml = "";

    if(employees && employees.length > 0){

      employees.forEach(employee => {

        employeesHtml += `
          <div class="employee-item">
            👤 ${employee.employee_name}
          </div>
        `;

      });

    } else {

      employeesHtml = "Žiadni zamestnanci";

    }

    document.getElementById("employeesList").innerHTML =
      employeesHtml;

  }
  catch(error){

    console.error(error);

    document.getElementById("business").innerText =
      "Chyba spojenia";

  }

}

loadDashboard();

</script>

</body>
</html>
