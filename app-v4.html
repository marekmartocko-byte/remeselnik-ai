<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Remeselník AI Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#020617;
color:white;
display:flex;
height:100vh;
overflow:hidden;
}

.sidebar{
width:260px;
background:#0f172a;
padding:20px;
border-right:1px solid #1e293b;
}

.logo{
font-size:24px;
font-weight:bold;
margin-bottom:30px;
}

.menu{
display:flex;
flex-direction:column;
gap:10px;
}

.menu button{
background:#111827;
border:none;
color:white;
padding:15px;
border-radius:10px;
cursor:pointer;
text-align:left;
}

.menu button:hover{
background:#2563eb;
}

.main{
flex:1;
padding:25px;
overflow:auto;
}

.cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
margin-bottom:25px;
}

.card{
background:#0f172a;
border:1px solid #1e293b;
border-radius:15px;
padding:20px;
}

.kpi{
font-size:32px;
font-weight:bold;
color:#3b82f6;
margin-top:10px;
}

.section{
background:#0f172a;
border:1px solid #1e293b;
border-radius:15px;
padding:20px;
margin-bottom:20px;
}

.section h2{
margin-bottom:15px;
}

input{
width:100%;
padding:12px;
border:none;
border-radius:10px;
margin-bottom:10px;
}

.btn{
background:#2563eb;
color:white;
border:none;
padding:12px 18px;
border-radius:10px;
cursor:pointer;
}

.employee{
background:#111827;
padding:12px;
margin-top:10px;
border-radius:10px;
}

.calendar{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.slot{
background:#111827;
padding:15px;
border-radius:10px;
border:1px solid #1e293b;
}

</style>

</head>

<body>

<div class="sidebar">

<div class="logo">
🤖 Remeselník AI
</div>

<div class="menu">
<button>📊 Dashboard</button>
<button>📅 Kalendár</button>
<button>👥 Zákazníci</button>
<button>👨‍💼 Zamestnanci</button>
<button>🛠️ Služby</button>
<button>🌐 Widget</button>
<button>⚙️ Nastavenia</button>
</div>

</div>

<div class="main">

<h1>Spravujte svoju prevádzku inteligentne</h1>

<br>

<div class="cards">

<div class="card">
Rezervácie
<div class="kpi" id="bookingCount">0</div>
</div>

<div class="card">
Zákazníci
<div class="kpi" id="customerCount">0</div>
</div>

<div class="card">
Zamestnanci
<div class="kpi" id="employeeCount">0</div>
</div>

<div class="card">
Obrat
<div class="kpi">4 850€</div>
</div>

</div>

<div class="section">

<h2>👨‍💼 Zamestnanci</h2>

<input
id="employeeName"
placeholder="Meno zamestnanca">

<button
class="btn"
onclick="addEmployee()">

Pridať zamestnanca

</button>

<div id="employees"></div>

</div>

<div class="section">

<h2>📅 Kalendár rezervácií</h2>
<br>

<input
id="bookingName"
placeholder="Meno zákazníka">

<input
id="bookingTime"
placeholder="Čas napr. 10:00">

<button
class="btn"
onclick="addBooking()">

Pridať rezerváciu

</button>

<br><br>

<div id="calendarBookings"></div>
<div class="calendar">

<div class="slot">09:00 Voľné</div>
<div class="slot">10:00 Voľné</div>
<div class="slot">11:00 Voľné</div>
<div class="slot">12:00 Voľné</div>
<div class="slot">13:00 Voľné</div>
<div class="slot">14:00 Voľné</div>
<div class="slot">15:00 Voľné</div>
<div class="slot">16:00 Voľné</div>
<div class="slot">17:00 Voľné</div>
<div class="slot">18:00 Voľné</div>

</div>

</div>

</div>

<script>

loadEmployees();

function addEmployee(){

const name =
document.getElementById(
"employeeName"
).value;

if(!name) return;

let employees =
JSON.parse(
localStorage.getItem(
"employees"
)
) || [];

employees.push(name);

localStorage.setItem(
"employees",
JSON.stringify(employees)
);

document.getElementById(
"employeeName"
).value = "";

loadEmployees();

}

function loadEmployees(){

let employees =
JSON.parse(
localStorage.getItem(
"employees"
)
) || [];

document.getElementById(
"employees"
).innerHTML = "";

employees.forEach(emp=>{

document.getElementById(
"employees"
).innerHTML +=

`<div class="employee">
👨‍💼 ${emp}
</div>`;

});

document.getElementById(
"employeeCount"
).innerText =
employees.length;

}
loadBookings();

function addBooking(){

const booking={

name:
document.getElementById(
"bookingName"
).value,

time:
document.getElementById(
"bookingTime"
).value

};

let bookings=
JSON.parse(
localStorage.getItem(
"calendarBookings"
)
)||[];

bookings.push(booking);

localStorage.setItem(
"calendarBookings",
JSON.stringify(bookings)
);

document.getElementById(
"bookingName"
).value="";

document.getElementById(
"bookingTime"
).value="";

loadBookings();

}

function loadBookings(){

let bookings=
JSON.parse(
localStorage.getItem(
"calendarBookings"
)
)||[];

document.getElementById(
"calendarBookings"
).innerHTML="";

bookings.forEach(booking=>{

document.getElementById(
"calendarBookings"
).innerHTML += `

<div class="employee">

📅 ${booking.time}

<br>

👤 ${booking.name}

</div>

`;

});

document.getElementById(
"bookingCount"
).innerText=
bookings.length;

}
</script>

</body>
</html>
