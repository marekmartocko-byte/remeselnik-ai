<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remeselník AI Dashboard</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#020617;
color:white;
display:flex;
height:100vh;
}

.sidebar{
width:250px;
background:#0f172a;
padding:20px;
}

.logo{
font-size:24px;
font-weight:bold;
margin-bottom:30px;
}

.menu button{
width:100%;
margin-bottom:10px;
padding:12px;
background:#111827;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
text-align:left;
}

.main{
flex:1;
padding:25px;
overflow:auto;
}

.cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
margin-bottom:20px;
}

.card,.section{
background:#0f172a;
border:1px solid #1e293b;
border-radius:15px;
padding:20px;
}

.kpi{
font-size:32px;
font-weight:bold;
color:#3b82f6;
}

.section{
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin-bottom:10px;
border:none;
border-radius:10px;
}

.btn{
background:#2563eb;
color:white;
border:none;
padding:12px 18px;
border-radius:10px;
cursor:pointer;
}

.employee{
background:#111827;
padding:12px;
margin-top:10px;
border-radius:10px;
}

.calendar{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-top:15px;
}

.slot{
background:#111827;
padding:15px;
border-radius:10px;
}
</style>
</head>

<body>

<div class="sidebar">

<div class="logo">
🤖 Remeselník AI
</div>

<div class="menu">
<button>📊 Dashboard</button>
<button>📅 Kalendár</button>
<button>👥 Zákazníci</button>
<button>👨‍💼 Zamestnanci</button>
<button>🛠️ Služby</button>
<button>🌐 Widget</button>
<button>⚙️ Nastavenia</button>
</div>

</div>

<div class="main">

<h1>Spravujte svoju prevádzku inteligentne</h1>

<br>

<div class="cards">

<div class="card">
Rezervácie
<div class="kpi" id="bookingCount">0</div>
</div>

<div class="card">
Zákazníci
<div class="kpi">0</div>
</div>

<div class="card">
Zamestnanci
<div class="kpi" id="employeeCount">0</div>
</div>

<div class="card">
Obrat
<div class="kpi">4850€</div>
</div>

</div>

<div class="section">

<h2>👨‍💼 Zamestnanci</h2>

<input id="employeeName" placeholder="Meno zamestnanca">

<button class="btn" onclick="addEmployee()">
Pridať zamestnanca
</button>

<div id="employees"></div>

</div>

<div class="section">

<h2>📅 Kalendár rezervácií</h2>

<input id="bookingName" placeholder="Meno zákazníka">

<input id="bookingTime" placeholder="Čas napr. 10:00">

<button class="btn" onclick="addBooking()">
Pridať rezerváciu
</button>

<div id="calendarBookings"></div>

<div class="calendar">

<div class="slot">09:00 Voľné</div>
<div class="slot">10:00 Voľné</div>
<div class="slot">11:00 Voľné</div>
<div class="slot">12:00 Voľné</div>
<div class="slot">13:00 Voľné</div>
<div class="slot">14:00 Voľné</div>
<div class="slot">15:00 Voľné</div>
<div class="slot">16:00 Voľné</div>
<div class="slot">17:00 Voľné</div>
<div class="slot">18:00 Voľné</div>

</div>

</div>

</div>

<script>

function addEmployee(){

const name =
document.getElementById("employeeName").value;

if(!name) return;

const div =
document.createElement("div");

div.className="employee";
div.innerHTML="👨‍💼 "+name;

document.getElementById("employees")
.appendChild(div);

document.getElementById("employeeName")
.value="";

let count =
parseInt(
document.getElementById("employeeCount")
.innerText
);

document.getElementById("employeeCount")
.innerText=count+1;

}

function addBooking(){

const name =
document.getElementById("bookingName").value;

const time =
document.getElementById("bookingTime").value;

if(!name || !time){
alert("Vyplň meno aj čas");
return;
}

const div =
document.createElement("div");

div.className="employee";

div.innerHTML=
"📅 "+time+
"<br>👤 "+name;

document.getElementById("calendarBookings")
.appendChild(div);

document.getElementById("bookingName")
.value="";

document.getElementById("bookingTime")
.value="";

let count =
parseInt(
document.getElementById("bookingCount")
.innerText
);

document.getElementById("bookingCount")
.innerText=count+1;

}

</script>

</body>
</html>
