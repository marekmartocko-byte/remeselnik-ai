<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remeselník AI Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#020617;
color:white;
display:flex;
min-height:100vh;
}

.sidebar{
width:250px;
background:#0f172a;
padding:25px;
}

.sidebar h2{
margin-bottom:25px;
}

.sidebar a{
display:block;
color:white;
text-decoration:none;
padding:12px;
margin-bottom:10px;
border-radius:10px;
background:#111827;
}

.sidebar a:hover{
background:#2563eb;
}

.content{
flex:1;
padding:30px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-top:20px;
margin-bottom:30px;
}

.card{
background:#0f172a;
padding:20px;
border-radius:15px;
border:1px solid #1e293b;
}

.card h2{
color:#3b82f6;
margin-bottom:10px;
}

.section{
background:#0f172a;
padding:20px;
border-radius:15px;
border:1px solid #1e293b;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
border:none;
border-radius:10px;
margin-bottom:10px;
}

button{
background:#2563eb;
color:white;
border:none;
padding:12px 16px;
border-radius:10px;
cursor:pointer;
}

.item{
background:#111827;
padding:12px;
margin-top:10px;
border-radius:10px;
}

</style>
</head>
<body>

<div class="sidebar">

<h2>🤖 Remeselník AI</h2>

<a href="#">🤖 AI</a>
nia</a>

</div>

<div class="content">

<h1>Dashboard</h1>

<div class="cards">

<div class="card">
<h2 id="bookingCount">0</h2>
<p>Rezervácií dnes</p>
</div>

<div class="card">
<h2>1280€</h2>
<p>Denný obrat</p>
</div>

<div class="card">
<h2 id="employeeCount">0</h2>
<p>Zamestnanci</p>
</div>

<div class="card">
<h2>98%</h2>
<p>Spokojnosť</p>
</div>

</div>

<div class="section">

<h2>👨‍💼 Zamestnanci</h2>

<input
id="employeeName"
placeholder="Meno zamestnanca">

<button onclick="addEmployee()">
Pridať zamestnanca
</button>

<div id="employees"></div>

</div>

<div class="section">

<h2>📅 Nová rezervácia</h2>

<input
id="bookingName"
placeholder="Meno zákazníka">

<input
id="bookingTime"
placeholder="Čas napr. 10:00">

<button onclick="addBooking()">
Pridať rezerváciu
</button>

<div id="bookings"></div>

</div>

</div>

<script>

function addEmployee(){

const name =
document.getElementById("employeeName").value;

if(!name) return;

const div =
document.createElement("div");

div.className="item";
div.innerText="👨‍💼 " + name;

document.getElementById("employees")
.appendChild(div);

document.getElementById("employeeName")
.value="";

let count =
parseInt(
document.getElementById("employeeCount")
.innerText
);

document.getElementById("employeeCount")
.innerText = count + 1;

}

function addBooking(){

const name =
document.getElementById("bookingName").value;

const time =
document.getElementById("bookingTime").value;

if(!name || !time){
alert("Vyplň meno a čas");
return;
}

const div =
document.createElement("div");

div.className="item";

div.innerHTML =
"📅 " + time +
"<br>👤 " + name;

document.getElementById("bookings")
.appendChild(div);

document.getElementById("bookingName")
.value="";

document.getElementById("bookingTime")
.value="";

let count =
parseInt(
document.getElementById("bookingCount")
.innerText
);

document.getElementById("bookingCount")
.innerText = count + 1;

}

</script>

</body>
</html>
