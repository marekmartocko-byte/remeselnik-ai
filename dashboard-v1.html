<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remeselník AI Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#020617;
color:white;
display:flex;
min-height:100vh;
}

.sidebar{
width:260px;
background:#0f172a;
padding:30px;
}

.logo{
font-size:28px;
font-weight:bold;
margin-bottom:30px;
}

.nav-btn{
display:block;
width:100%;
background:#111827;
color:white;
border:none;
padding:14px;
margin-bottom:10px;
border-radius:10px;
cursor:pointer;
text-align:left;
}

.nav-btn:hover{
background:#2563eb;
}

.content{
flex:1;
padding:30px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin:25px 0;
}

.card{
background:#0f172a;
border:1px solid #1e293b;
border-radius:15px;
padding:20px;
}

.big{
font-size:36px;
font-weight:bold;
color:#3b82f6;
}

.section{
background:#0f172a;
border:1px solid #1e293b;
border-radius:15px;
padding:20px;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
border:none;
border-radius:10px;
margin-bottom:10px;
}

button.action{
background:#2563eb;
color:white;
border:none;
padding:12px 15px;
border-radius:10px;
cursor:pointer;
}

.item{
background:#111827;
padding:12px;
border-radius:10px;
margin-top:10px;
}

</style>
</head>

<body>

<div class="sidebar">

<div class="logo">
🤖 Remeselník AI
</div>

<button class="nav-btn">📊 Dashboard</button>
<button class="nav-btn">📅 Rezervácie</button>
<button class="nav-btn">👥 Zákazníci</button>
<button class="nav-btn">👨‍💼 Zamestnanci</button>
<button class="nav-btn">🛠️ Služby</button>
<button class="nav-btn">⚙️ Nastavenia</button>

</div>

<div class="content">

<h1>Spravujte svoju prevádzku inteligentne</h1>

<div class="cards">

<div class="card">
<div class="big" id="bookingCount">0</div>
<div>Rezervácií</div>
</div>

<div class="card">
<div class="big" id="customerCount">0</div>
<div>Zákazníkov</div>
</div>

<div class="card">
<div class="big" id="employeeCount">0</div>
<div>Zamestnancov</div>
</div>

<div class="card">
<div class="big">4850€</div>
<div>Obrat</div>
</div>

</div>

<div class="section">

<h2>👨‍💼 Zamestnanci</h2>

<br>

<input
id="employeeName"
placeholder="Meno zamestnanca">

<button
class="action"
onclick="addEmployee()">

Pridať zamestnanca

</button>

<div id="employeeList"></div>

</div>

<div class="section">

<h2>📅 Rezervácie</h2>

<br>

<input
id="bookingCustomer"
placeholder="Meno zákazníka">

<input
id="bookingTime"
placeholder="Čas napr. 10:00">

<button
class="action"
onclick="addBooking()">

Pridať rezerváciu

</button>

<div id="bookingList"></div>

</div>

</div>

<script>

let employees =
JSON.parse(
localStorage.getItem("employees")
) || [];

let bookings =
JSON.parse(
localStorage.getItem("bookings")
) || [];

function saveData(){

localStorage.setItem(
"employees",
JSON.stringify(employees)
);

localStorage.setItem(
"bookings",
JSON.stringify(bookings)
);

}

function renderEmployees(){

const list =
document.getElementById(
"employeeList"
);

list.innerHTML = "";

employees.forEach(emp => {

list.innerHTML += `
<div class="item">
👨‍💼 ${emp}
</div>
`;

});

document.getElementById(
"employeeCount"
).innerText =
employees.length;

}

function renderBookings(){

const list =
document.getElementById(
"bookingList"
);

list.innerHTML = "";

bookings.forEach(item => {

list.innerHTML += `
<div class="item">
📅 ${item.time}<br>
👤 ${item.customer}
</div>
`;

});

document.getElementById(
"bookingCount"
).innerText =
bookings.length;

}

function addEmployee(){

const input =
document.getElementById(
"employeeName"
);

const name =
input.value.trim();

if(!name) return;

employees.push(name);

saveData();
renderEmployees();

input.value = "";

}

function addBooking(){

const customer =
document.getElementById(
"bookingCustomer"
).value.trim();

const time =
document.getElementById(
"bookingTime"
).value.trim();

if(!customer || !time){

alert(
"Vyplň meno zákazníka a čas."
);

return;
}

bookings.push({
customer,
time
});

saveData();
renderBookings();

document.getElementById(
"bookingCustomer"
).value = "";

document.getElementById(
"bookingTime"
).value = "";

}

renderEmployees();
renderBookings();

</script>

</body>
</html>
