<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remeselník AI</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
display:flex;
height:100vh;
background:#0f172a;
color:white;
}

.sidebar{
width:250px;
background:#111827;
padding:20px;
}

.logo{
font-size:28px;
font-weight:bold;
margin-bottom:20px;
}

.nav-btn{
width:100%;
padding:12px;
margin-bottom:10px;
border:none;
border-radius:10px;
background:#1f2937;
color:white;
cursor:pointer;
}

.nav-btn:hover,
.nav-btn.active{
background:#2563eb;
}

.content{
flex:1;
padding:20px;
}

.page{
display:none;
}

.page.active{
display:block;
}

.card{
background:#1f2937;
padding:20px;
border-radius:12px;
margin-bottom:15px;
}

input{
width:100%;
padding:10px;
margin:10px 0;
border:none;
border-radius:8px;
}

button.action{
padding:10px 14px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

.item{
background:#334155;
padding:10px;
margin-top:10px;
border-radius:8px;
}
</style>

</head>
<body>

<div class="sidebar">

<div class="logo">
🤖 Remeselník AI
</div>

<button class="nav-btn active" onclick="showPage('dashboard',this)">Dashboard</button>
<button class="nav-btn" onclick="showPage('employees',this)">Zamestnanci</button>
<button class="nav-btn" onclick="showPage('customers',this)">Zákazníci</button>
<button class="nav-btn" onclick="showPage('bookings',this)">Rezervácie</button>

</div>

<div class="content">

<div id="dashboard" class="page active">

<h1>Dashboard</h1>

<div class="card">
Počet zamestnancov:
<span id="employeeCount">0</span>
</div>

<div class="card">
Počet zákazníkov:
<span id="customerCount">0</span>
</div>

<div class="card">
Počet rezervácií:
<span id="bookingCount">0</span>
</div>

</div>

<div id="employees" class="page">

<h1>Zamestnanci</h1>

<input id="employeeName" placeholder="Meno zamestnanca">

<button class="action" onclick="addEmployee()">
Pridať
</button>

<div id="employeeList"></div>

</div>

<div id="customers" class="page">

<h1>Zákazníci</h1>

<input id="customerName" placeholder="Meno zákazníka">

<button class="action" onclick="addCustomer()">
Pridať
</button>

<div id="customerList"></div>

</div>

<div id="bookings" class="page">

<h1>Rezervácie</h1>

<input id="bookingName" placeholder="Meno zákazníka">

<input id="bookingTime" placeholder="Čas 10:00">

<button class="action" onclick="addBooking()">
Pridať
</button>

<div id="bookingList"></div>

</div>

</div>

<script>

let employees =
JSON.parse(localStorage.getItem("employees")) || [];

let customers =
JSON.parse(localStorage.getItem("customers")) || [];

let bookings =
JSON.parse(localStorage.getItem("bookings")) || [];

function saveData(){

localStorage.setItem(
"employees",
JSON.stringify(employees)
);

localStorage.setItem(
"customers",
JSON.stringify(customers)
);

localStorage.setItem(
"bookings",
JSON.stringify(bookings)
);

}

function showPage(pageId,button){

document.querySelectorAll(".page")
.forEach(function(page){
page.classList.remove("active");
});

document.querySelectorAll(".nav-btn")
.forEach(function(btn){
btn.classList.remove("active");
});

document.getElementById(pageId)
.classList.add("active");

button.classList.add("active");

}

function addEmployee(){

const name =
document.getElementById(
"employeeName"
).value.trim();

if(!name) return;

employees.push(name);

saveData();

document.getElementById(
"employeeName"
).value = "";

render();

}

function addCustomer(){

const name =
document.getElementById(
"customerName"
).value.trim();

if(!name) return;

customers.push(name);

saveData();

document.getElementById(
"customerName"
).value = "";

render();

}

function addBooking(){

const name =
document.getElementById(
"bookingName"
).value.trim();

const time =
document.getElementById(
"bookingTime"
).value.trim();

if(!name || !time){
return;
}

bookings.push({
name:name,
time:time
});

saveData();

document.getElementById(
"bookingName"
).value = "";

document.getElementById(
"bookingTime"
).value = "";

render();

}

function render(){

document.getElementById(
"employeeCount"
).innerText =
employees.length;

document.getElementById(
"customerCount"
).innerText =
customers.length;

document.getElementById(
"bookingCount"
).innerText =
bookings.length;

const employeeList =
document.getElementById(
"employeeList"
);

employeeList.innerHTML = "";

employees.forEach(function(emp){

employeeList.innerHTML +=
`<div class="item">${emp}</div>`;

});

const customerList =
document.getElementById(
"customerList"
);

customerList.innerHTML = "";

customers.forEach(function(c){

customerList.innerHTML +=
`<div class="item">${c}</div>`;

});

const bookingList =
document.getElementById(
"bookingList"
);

bookingList.innerHTML = "";

bookings.forEach(function(b){

bookingList.innerHTML +=
`<div class="item">
${b.time} - ${b.name}
</div>`;

});

}

render();

</script>

</body>
</html>
