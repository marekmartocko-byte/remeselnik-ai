<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Remeselník AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
display:flex;
min-height:100vh;
background:#0f172a;
color:white;
}

.sidebar{
width:250px;
background:#111827;
padding:20px;
border-right:1px solid rgba(255,255,255,.08);
}

.logo{
font-size:28px;
font-weight:700;
margin-bottom:25px;
}

.nav-btn{
width:100%;
padding:14px;
margin-bottom:10px;
border:none;
border-radius:12px;
background:#1f2937;
color:white;
cursor:pointer;
font-size:15px;
transition:.2s;
}

.nav-btn:hover,
.nav-btn.active{
background:#2563eb;
}

.content{
flex:1;
padding:25px;
overflow:auto;
}

.page{
display:none;
}

.page.active{
display:block;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-bottom:25px;
}

.card{
background:linear-gradient(135deg,#1e293b,#0f172a);
padding:20px;
border-radius:16px;
border:1px solid rgba(255,255,255,.08);
box-shadow:0 10px 25px rgba(0,0,0,.25);
}

.card h3{
font-size:15px;
color:#cbd5e1;
margin-bottom:10px;
}

.card h2{
font-size:34px;
color:#3b82f6;
}

.section{
background:#111827;
padding:20px;
border-radius:16px;
margin-top:20px;
}

.section h2{
margin-bottom:15px;
}

input,
select{
width:100%;
padding:12px;
border:none;
border-radius:10px;
margin-bottom:10px;
background:#1f2937;
color:white;
}

.action{
padding:12px 15px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
cursor:pointer;
font-weight:600;
}

.action:hover{
background:#1d4ed8;
}

.item{
background:#1f2937;
padding:15px;
border-radius:12px;
margin-top:10px;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.delete-btn{
background:#dc2626;
border:none;
padding:8px 12px;
border-radius:8px;
color:white;
cursor:pointer;
}

.delete-btn:hover{
background:#b91c1c;
}

.booking-info{
display:flex;
flex-direction:column;
gap:4px;
}

.title{
font-size:42px;
font-weight:800;
margin-bottom:20px;
}

@media(max-width:900px){

body{
flex-direction:column;
}

.sidebar{
width:100%;
}

}

</style>
</head>
<body>

<div class="sidebar">

<div class="logo">
🤖 Remeselník AI
</div>

<button class="nav-btn active" onclick="showPage('dashboard',this)">📊 Dashboard</button>
<button class="nav-btn" onclick="showPage('employees',this)">👷 Zamestnanci</button>
<button class="nav-btn" onclick="showPage('customers',this)">👥 Zákazníci</button>
<button class="nav-btn" onclick="showPage('bookings',this)">📅 Rezervácie</button>

</div>

<div class="content">

<div id="dashboard" class="page active">

<h1 class="title">
Spravujte svoju prevádzku inteligentne
</h1>

<div class="stats">

<div class="card">
<h3>Zamestnanci</h3>
<h2 id="employeeCount">0</h2>
</div>

<div class="card">
<h3>Zákazníci</h
