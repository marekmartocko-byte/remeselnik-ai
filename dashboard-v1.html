<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remeselník AI Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,Arial,sans-serif;
}

body{
background:#020617;
color:#fff;
display:flex;
min-height:100vh;
}

.sidebar{
width:260px;
background:#0f172a;
padding:25px;
border-right:1px solid #1e293b;
}

.logo{
font-size:28px;
font-weight:bold;
margin-bottom:25px;
}

.nav-btn{
width:100%;
padding:14px;
margin-bottom:10px;
background:#111827;
border:none;
border-radius:12px;
color:#fff;
cursor:pointer;
text-align:left;
}

.nav-btn:hover{
background:#2563eb;
}

.content{
flex:1;
padding:25px;
}

.page{
display:none;
}

.page.active{
display:block;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin:20px 0;
}

.card{
background:#0f172a;
border:1px solid #1e293b;
border-radius:16px;
padding:20px;
}

.big{
font-size:38px;
font-weight:bold;
color:#3b82f6;
}

.section{
background:#0f172a;
border:1px solid #1e293b;
border-radius:16px;
padding:20px;
margin-top:20px;
}

input,select{
width:100%;
padding:12px;
margin-bottom:10px;
border:none;
border-radius:10px;
}

.action{
background:#2563eb;
color:white;
border:none;
padding:12px 15px;
border-radius:10px;
cursor:pointer;
}

.item{
background:#111827;
padding:12px;
margin-top:10px;
border-radius:10px;
}

.deleteBtn{
float:right;
background:#dc2626;
border:none;
color:white;
padding:5px 10px;
border-radius:8px;
cursor:pointer;
}

.calendar{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
gap:10px;
margin-top:20px;
}

.slot{
background:#111827;
padding:12px;
border-radius:10px;
text-align:center;
}

</style>
</head>
<body>

<div class="sidebar">

<div class="logo">
🤖 Remeselník AI
</div>

<button class="nav-btn" onclick="showPage('dashboard')">📊 Dashboard</button>
<button class="nav-btn" onclick="showPage('bookings')">📅 Rezervácie</button>
<button class="nav-btn" onclick="showPage('customers')">👥 Zákazníci</button>
<button class="nav-btn" onclick="showPage('employees')">👨‍💼 Zamestnanci</button>

</div>

<div class="content">

<div id="dashboard" class="page active">

<h1>Dashboard</h1>

<div class="cards">

<div class="card">
<div class="big" id="bookingCount">0</div>
<div>Rezervácií</div>
</div>

<div class="card">
<div class="big" id="customerCount">0</div>
<div>Zákazníkov</div>
</div>

<div class="card">
<div class="big" id="employeeCount">0</div>
<div>Zamestnancov</div>
</div>

<div class="card">
<div class="big">4850€</div>
<div>Obrat</div>
</div>

</div>

</div>

<div id="employees" class="page">

<div class="section">

<h2>👨‍💼 Zamestnanci</h2>

<input id="employeeName" placeholder="Meno zamestnanca">

<button class="action" onclick="addEmployee()">
Pridať zamestnanca
</button>

<div id="employeeList"></div>

</div>

</div>

<div id="customers" class="page">

<div class="section">

<h2>👥 Zákazníci</h2>

<input id="customerName" placeholder="Meno">
<input id="customerPhone" placeholder="Telefón">
<input id="customerEmail" placeholder="Email">

<button class="action" onclick="addCustomer()">
Pridať zákazníka
</button>

<div id="customerList"></div>

</div>

</div>

<div id="bookings" class="page">

<div class="section">

<h2>📅 Rezervácie</h2>

<input id="bookingCustomer" placeholder="Meno zákazníka">

<select id="bookingEmployee">
<option value="">Vyber zamestnanca</option>
</select>

<input id="bookingTime" placeholder="Čas napr. 10:00">

<button class="action" onclick="addBooking()">
Pridať rezerváciu
</button>

<div id="bookingList"></div>

<div class="calendar" id="calendarView"></div>

</div>

</div>

</div>

<script>

let employees =
JSON.parse(localStorage.getItem("employees")) || [];

let customers =
JSON.parse(localStorage.getItem("customers")) || [];

let bookings =
JSON.parse(localStorage.getItem("bookings")) || [];

function saveData(){

localStorage.setItem(
"employees",
JSON.stringify(employees)
);

localStorage.setItem(
"customers",
JSON.stringify(customers)
);

localStorage.setItem(
"bookings",
JSON.stringify(bookings)
);

}

function showPage(id){

document
.querySelectorAll(".page")
.forEach(page=>{
page.classList.remove("active");
});

document
.getElementById(id)
.classList.add("active");

}
