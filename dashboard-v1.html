<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remeselník AI Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,Arial,sans-serif;
}

body{
background:#020617;
color:white;
display:flex;
min-height:100vh;
}

.sidebar{
width:260px;
background:#0f172a;
padding:30px;
border-right:1px solid #1e293b;
}

.logo{
font-size:30px;
font-weight:bold;
margin-bottom:30px;
}

.nav-btn{
display:block;
width:100%;
padding:14px;
margin-bottom:10px;
background:#111827;
border:none;
color:white;
border-radius:12px;
cursor:pointer;
text-align:left;
}

.nav-btn:hover{
background:#2563eb;
}

.content{
flex:1;
padding:30px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin:25px 0;
}

.card{
background:#0f172a;
border:1px solid #1e293b;
border-radius:16px;
padding:20px;
}

.big{
font-size:38px;
font-weight:bold;
color:#3b82f6;
}

.section{
background:#0f172a;
border:1px solid #1e293b;
border-radius:16px;
padding:20px;
margin-bottom:20px;
}

.section h2{
margin-bottom:15px;
}

input{
width:100%;
padding:12px;
border:none;
border-radius:10px;
margin-bottom:10px;
background:white;
}

.action{
background:#2563eb;
color:white;
border:none;
padding:12px 15px;
border-radius:10px;
cursor:pointer;
}

.action:hover{
background:#1d4ed8;
}

.item{
background:#111827;
padding:12px;
border-radius:10px;
margin-top:10px;
}

.deleteBtn{
float:right;
background:#dc2626;
border:none;
padding:6px 10px;
border-radius:8px;
color:white;
cursor:pointer;
}

.deleteBtn:hover{
background:#b91c1c;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

@media(max-width:900px){

body{
flex-direction:column;
}

.sidebar{
width:100%;
}

.grid{
grid-template-columns:1fr;
}

}
</style>
</head>

<body>

<div class="sidebar">

<div class="logo">
🤖 Remeselník AI
</div>

<button class="nav-btn">📊 Dashboard</button>
<button class="nav-btn">📅 Rezervácie</button>
<button class="nav-btn">👥 Zákazníci</button>
<button class="nav-btn">👨‍💼 Zamestnanci</button>
<button class="nav-btn">🛠️ Služby</button>
<button class="nav-btn">⚙️ Nastavenia</button>

</div>

<div class="content">

<h1>Spravujte svoju prevádzku inteligentne</h1>

<div class="cards">

<div class="card">
<div class="big" id="bookingCount">0</div>
<div>Rezervácií</div>
</div>

<div class="card">
<div class="big" id="customerCount">0</div>
<div>Zákazníkov</div>
</div>

<div class="card">
<div class="big" id="employeeCount">0</div>
<div>Zamestnancov</div>
</div>

<div class="card">
<div class="big">4850€</div>
<div>Obrat</div>
</div>

</div>

<div class="grid">

<div class="section">

<h2>👨‍💼 Zamestnanci</h2>

<input
id="employeeName"
placeholder="Meno zamestnanca">

<button
class="action"
onclick="addEmployee()">

Pridať zamestnanca

</button>

<div id="employeeList"></div>

</div>

<div class="section">

<h2>👥 Zákazníci</h2>

<input
id="customerName"
placeholder="Meno zákazníka">

<input
id="customerPhone"
placeholder="Telefón">

<input
id="customerEmail"
placeholder="Email">

<button
class="action"
onclick="addCustomer()">

Pridať zákazníka

</button>

<div id="customerList"></div>

</div>

</div>

<div class="section">

<h2>📅 Rezervácie</h2>

<input
id="bookingCustomer"
placeholder="Meno zákazníka">

<input
id="bookingTime"
placeholder="Čas (napr. 10:00)">

<button
class="action"
onclick="addBooking()">

Pridať rezerváciu

</button>

<div id="bookingList"></div>

</div>

</div>

<script>

let employees =
JSON.parse(localStorage.getItem("employees"))
|| [];

let customers =
JSON.parse(localStorage.getItem("customers"))
|| [];

let bookings =
JSON.parse(localStorage.getItem("bookings"))
|| [];

function saveData(){

localStorage.setItem(
"employees",
JSON.stringify(employees)
);

localStorage.setItem(
"customers",
JSON.stringify(customers)
);

localStorage.setItem(
"bookings",
JSON.stringify(bookings)
);

}

function addEmployee(){

const name =
document.getElementById(
"employeeName"
).value.trim();

if(!name) return;

employees.push(name);

saveData();
renderEmployees();

document.getElementById(
"employeeName"
).value="";

}

function deleteEmployee(index){

employees.splice(index,1);

saveData();
renderEmployees();

}

function renderEmployees(){

const list =
document.getElementById(
"employeeList"
);

list.innerHTML="";

employees.forEach((emp,index)=>{

list.innerHTML += `
<div class="item">

👨‍💼 ${emp}

<button
class="deleteBtn"
onclick="deleteEmployee(${index})">
🗑
</button>

</div>
`;

});

document.getElementById(
"employeeCount"
).innerText =
employees.length;

}

function addCustomer(){

const name =
document.getElementById(
"customerName"
).value.trim();

const phone =
document.getElementById(
"customerPhone"
).value.trim();

const email =
document.getElementById(
"customerEmail"
).value.trim();

if(!name) return;

customers.push({
name,
phone,
email
});

saveData();
renderCustomers();

document.getElementById(
"customerName"
).value="";

document.getElementById(
"customerPhone"
).
