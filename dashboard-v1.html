<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remeselník AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,Arial,sans-serif;
}

body{
background:#0b1120;
color:#fff;
display:flex;
height:100vh;
overflow:hidden;
}

.sidebar{
width:260px;
background:#111827;
padding:20px;
border-right:1px solid #1f2937;
}

.logo{
font-size:28px;
font-weight:800;
margin-bottom:30px;
}

.nav-btn{
display:block;
width:100%;
padding:14px;
margin-bottom:10px;
border:none;
background:#1f2937;
color:#fff;
border-radius:12px;
cursor:pointer;
text-align:left;
font-size:15px;
}

.nav-btn:hover,
.nav-btn.active{
background:#2563eb;
}

.content{
flex:1;
overflow:auto;
padding:25px;
}

.page{
display:none;
}

.page.active{
display:block;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin:20px 0;
}

.card{
background:#111827;
padding:20px;
border-radius:16px;
border:1px solid #1f2937;
}

.big{
font-size:38px;
font-weight:800;
color:#60a5fa;
}

.section{
background:#111827;
padding:20px;
border-radius:16px;
border:1px solid #1f2937;
margin-top:20px;
}

.section h2{
margin-bottom:15px;
}

input,
select,
textarea{
width:100%;
padding:12px;
border:none;
border-radius:10px;
margin-bottom:10px;
}

.btn{
background:#2563eb;
color:white;
border:none;
padding:12px 16px;
border-radius:10px;
cursor:pointer;
}

.btn-danger{
background:#dc2626;
}

.item{
background:#1f2937;
padding:12px;
border-radius:12px;
margin-top:10px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.calendar{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.slot{
background:#1f2937;
padding:15px;
border-radius:12px;
}

.small{
opacity:.8;
font-size:13px;
margin-top:5px;
}

@media(max-width:900px){

body{
flex-direction:column;
}

.sidebar{
width:100%;
}

.grid{
grid-template-columns:1fr;
}

.calendar{
grid-template-columns:1fr;
}

}
</style>
</head>

<body>

<div class="sidebar">

<div class="logo">
🤖 Remeselník AI
</div>

<button class="nav-btn active" onclick="showPage('dashboard',this)">
📊 Dashboard
</button>

<button class="nav-btn" onclick="showPage('calendar',this)">
🗓️ Kalendár
</button>

<button class="nav-btn" onclick="showPage('bookings',this)">
📅 Rezervácie
</button>

<button class="nav-btn" onclick="showPage('customers',this)">
👥 Zákazníci
</button>

<button class="nav-btn" onclick="showPage('employees',this)">
👨‍💼 Zamestnanci
</button>

<button class="nav-btn" onclick="showPage('services',this)">
🛠️ Služby
</button>

</div>

<div class="content">

<div id="dashboard" class="page active">

<h1>Dashboard</h1>

<div class="cards">

<div class="card">
<div class="big" id="bookingCount">0</div>
<div>Rezervácie</div>
</div>

<div class="card">
<div class="big" id="customerCount">0</div>
<div>Zákazníci</div>
</div>

<div class="card">
<div class="big" id="employeeCount">0</div>
<div>Zamestnanci</div>
</div>

<div class="card">
<div class="big" id="serviceCount">0</div>
<div>Služby</div>
</div>

</div>

<div class="section">
<h2>Najbližšie rezervácie</
